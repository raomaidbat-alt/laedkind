<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberPrompt Pro | Библиотека ИИ-протоколов для бизнеса</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-start: #0A1628;
      --bg-end: #1a2332;
      --brand-emerald: #00D9A3;
      --brand-indigo: #6366f1;
      --text-main: #E8EDF2;
      --text-muted: #94a3b8;
    }

    * { scroll-behavior: smooth; cursor: default; }
    body { 
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      background-attachment: fixed;
      color: var(--text-main); 
      font-family: 'Inter', sans-serif; 
      margin: 0; 
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .glow-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 15% 15%, rgba(0, 217, 163, 0.05) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.05) 0%, transparent 45%);
      z-index: -1; pointer-events: none;
    }

    .gradient-text {
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .reveal { opacity: 0; transform: translateY(15px); transition: all 0.6s cubic-bezier(0.2, 1, 0.3, 1); }
    .reveal.active { opacity: 1; transform: translateY(0); }

    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 217, 163, 0.2); border-radius: 10px; }

    .nav-glass {
      background: rgba(10, 22, 40, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tab-active {
      color: var(--brand-emerald);
      position: relative;
    }
    .tab-active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--brand-emerald);
      box-shadow: 0 0 12px var(--brand-emerald);
    }

    .btn-premium {
      background: linear-gradient(135deg, #00D9A3 0%, #00b084 100%);
      transition: all 0.3s ease;
    }
    .btn-premium:hover {
      box-shadow: 0 0 35px rgba(0, 217, 163, 0.25);
      transform: translateY(-2px);
    }

    .animate-pulse-subtle {
      animation: pulse-subtle 3s infinite;
    }

    @keyframes pulse-subtle {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 217, 163, 0.1); }
      50% { box-shadow: 0 0 40px rgba(0, 217, 163, 0.3); }
    }
    
    .card-glass {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.4s ease;
    }
    .card-glass:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(0, 217, 163, 0.3);
      box-shadow: 0 8px 32px rgba(0, 217, 163, 0.1);
      transform: translateY(-4px);
    }

    .case-card {
      background: rgba(10, 22, 40, 0.4);
      border-left: 4px solid var(--brand-emerald);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <div class="glow-bg"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
